name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  # The suite is ~420 tests x 3 browsers. Run as one job (1 worker, 2 retries)
  # it hit the 60-minute limit with only ~200 of 1260 tests done, so it is
  # sharded below: one job per browser x 8 shards, 2 workers, 1 retry, and a
  # merged HTML report. A docs/prototype-only (or workflow-only) diff cannot
  # change the app under test, so classify it first and let the `test` check
  # pass without starting the browser run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app_code: ${{ steps.classify.outputs.app_code }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Classify the diff
      id: classify
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_REF: ${{ github.base_ref }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
      run: |
        set -euo pipefail
        if [ "$EVENT_NAME" = "pull_request" ]; then
          base="origin/$PR_BASE_REF"
          if ! git rev-parse --verify --quiet "$base" >/dev/null; then
            echo "app_code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base"...HEAD)
        else
          base="$PUSH_BEFORE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "app_code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base"...HEAD)
        fi

        printf '%s\n' "$changed"
        if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -vE '^(docs/|\.github/|.*\.md$|netlify\.toml$)' >/dev/null; then
          echo "app_code=false" >> "$GITHUB_OUTPUT"
        else
          echo "app_code=true" >> "$GITHUB_OUTPUT"
        fi

  e2e:
    needs: changes
    if: needs.changes.outputs.app_code == 'true'
    name: e2e (${{ matrix.project }} ${{ matrix.shard }}/8)
    # Slowest shard (firefox, map specs timing out) took ~29 min at 6 shards;
    # at 8 it should be ~22. The cap stops a hung shard well before 60.
    timeout-minutes: 40
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright browser
      run: npx playwright install --with-deps ${{ matrix.project }}
    - name: Run Playwright tests
      run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/8
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: blob-report-${{ matrix.project }}-${{ matrix.shard }}
        path: blob-report/
        retention-days: 1

  merge-reports:
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    - name: Install dependencies
      run: npm ci
    - uses: actions/download-artifact@v4
      with:
        path: all-blob-reports
        pattern: blob-report-*
        merge-multiple: true
    - name: Merge into one HTML report
      run: npx playwright merge-reports --reporter html ./all-blob-reports
    - uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  # The single check to look at: green when every shard passed, or when the
  # diff is docs/CI-only and the browser suite was skipped.
  test:
    needs: [changes, e2e]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
    - name: Summarise the browser suite
      env:
        APP_CODE: ${{ needs.changes.outputs.app_code }}
        CHANGES: ${{ needs.changes.result }}
        E2E: ${{ needs.e2e.result }}
      run: |
        if [ "$CHANGES" != "success" ]; then echo "changes job: $CHANGES"; exit 1; fi
        if [ "$APP_CODE" != "true" ]; then echo "No app-code changes in this diff; skipping the browser suite."; exit 0; fi
        echo "e2e shards: $E2E"
        [ "$E2E" = "success" ]
