name: BanbeApp
options:
  bundleIdPrefix: com.banbe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Debug (default, free/personal team): ENABLE_PUSH=NO, entitlements omit
# aps-environment entirely (BanbeApp.entitlements) — real-device builds
# sign fine with automatic/personal-team provisioning.
# Release (paid team only): ENABLE_PUSH=YES, entitlements declare
# aps-environment (BanbeAppPush.entitlements). See
# .claude/notes/07-notifications.md for exactly what to flip once a paid
# Apple Developer account exists — it's these two files, not this one.
# PersonalTeamDebug: local real-device testing on a free/personal Apple ID
# with NO paid-program capability at all (also excludes Associated
# Domains, unlike the ordinary Debug config above) — see
# .claude/notes/18-ios-personal-team-signing.md.
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
  PersonalTeamDebug: Config/PersonalTeamDebug.xcconfig

# Registers the custom PersonalTeamDebug configuration (xcodegen only
# infers Debug/Release by default); "debug" here just picks its build
# settings TYPE (unoptimized, debug symbols) — it stays a fully separate
# configuration from Debug, not an alias for it.
configs:
  Debug: debug
  Release: release
  PersonalTeamDebug: debug

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.24.0

targets:
  BanbeApp:
    type: application
    platform: iOS
    sources:
      - path: BanbeApp
        excludes:
          - "**/.DS_Store"
      # The catalogue's photos, as the WebP derivatives produced by
      # Tools/optimize-photos.sh (~5MB for all 66). They ship with the app
      # for the same reason events.json does — it's the same static
      # catalogue — so the feed paints instantly and works offline instead
      # of pulling 20MB of JPEG over the network on first run. Referenced
      # in place rather than copied, so there's one source of truth.
      - path: ../../public/photos/optimized
        type: folder
        buildPhase: resources
      # The logo artwork the web app uses, referenced in place so both
      # frontends draw the same mark (see BanbeLogo).
      - path: ../../public/banbe-mark.png
        buildPhase: resources
      - path: ../../public/banbe-wordmark.png
        buildPhase: resources
      - path: ../../public/banbe-wordmark-sm.png
        buildPhase: resources
    resources:
      - BanbeApp/Resources
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banbe.ios
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # A real Apple Developer Team ID goes here once you have a PAID
        # account — a free/personal team works fine for everything else
        # (automatic signing installs to a real device), it just can't
        # provision Push Notifications (see Config/*.xcconfig, which is
        # where CODE_SIGN_ENTITLEMENTS/ENABLE_PUSH actually get set, per
        # config — not here, so they can differ between Debug and Release).
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        # .claude/notes/18-ios-personal-team-signing.md — a build-setting
        # variable (not a literal string) so CFBundleDisplayName below can
        # differ per configuration; Debug/Release keep the existing,
        # unchanged value ("banbe", exactly as it already was) via this
        # base default, and only PersonalTeamDebug overrides it, in the
        # `configs:` block right below.
        APP_DISPLAY_NAME: banbe
      # .claude/notes/18-ios-personal-team-signing.md — a distinct bundle
      # id for local personal-team installs, so Xcode's Automatic Signing
      # can freely register/use a brand-new App ID for it under a
      # signed-in personal Apple ID without ever touching (or colliding
      # with) the real com.banbe.ios App ID this project ships under.
      # DEVELOPMENT_TEAM is still never set here — only the bundle id
      # differs; Automatic Signing still resolves the team from whichever
      # Apple Account is signed into Xcode. APP_DISPLAY_NAME override makes
      # the Home Screen icon/name read "Banbe Dev" instead of the normal
      # build's "banbe" — the actual fix for "which install is this?"
      # confusion after stopping Xcode.
      configs:
        PersonalTeamDebug:
          PRODUCT_BUNDLE_IDENTIFIER: com.banbe.ios.dev
          APP_DISPLAY_NAME: "Banbe Dev"
    info:
      path: BanbeApp/Info.plist
      properties:
        # $(APP_DISPLAY_NAME) — Xcode substitutes this from the build
        # setting of the same name (defined per-configuration above), so
        # the Home Screen icon/name can differ between configs without a
        # second Info.plist. See .claude/notes/18-ios-personal-team-signing.md.
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "banbe uses your location to show how far events are and to filter the area picker."
        NSCameraUsageDescription: "banbe uses your camera to scan a guest's ticket QR code at check-in, and to attach a photo to a chat message."
        NSFaceIDUsageDescription: "banbe uses Face ID to unlock the app for a returning signed-in user."
        NSCalendarsFullAccessUsageDescription: "banbe adds an event to your calendar when you tap \"Add to Calendar\" on a ticket."
        NSPhotoLibraryAddUsageDescription: "banbe saves a chat photo to your library when you tap Save."
        # Opens a shared photo's organizer link straight in the app —
        # banbe://organizer/<eventKey>. A plain https:// link can only do
        # this through Universal Links, which need an Associated Domains
        # entitlement and a real Apple Team ID; until those exist the web
        # page shared alongside it offers this scheme as an "Open" button.
        CFBundleURLTypes:
          - CFBundleURLName: com.banbe.ios
            CFBundleURLSchemes: [banbe]
        # Task 1 (this session): portrait-only, no rotation — no view
        # controller/AppState override needed to match (confirmed by grep:
        # nothing in this app ever overrides
        # `supportedInterfaceOrientations`), this key alone is authoritative.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait

  BanbeAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BanbeAppUITests
    dependencies:
      - target: BanbeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banbe.ios.uitests
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: BanbeApp
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  BanbeApp:
    build:
      targets:
        BanbeApp: all
        BanbeAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BanbeAppUITests
  # .claude/notes/18-ios-personal-team-signing.md — a dedicated scheme so
  # "Select Personal Team Debug" is a single picker choice in Xcode's
  # scheme menu, not a manual per-run Edit Scheme > Build Configuration
  # change. Builds/runs the app target only (no UI tests — those aren't
  # part of local personal-device testing).
  PersonalTeamDebug:
    build:
      targets:
        BanbeApp: all
    run:
      config: PersonalTeamDebug
