name: BanbeApp
options:
  bundleIdPrefix: com.banbe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.24.0

targets:
  BanbeApp:
    type: application
    platform: iOS
    sources:
      - path: BanbeApp
        excludes:
          - "**/.DS_Store"
      # The catalogue's photos, as the WebP derivatives produced by
      # Tools/optimize-photos.sh (~5MB for all 66). They ship with the app
      # for the same reason events.json does — it's the same static
      # catalogue — so the feed paints instantly and works offline instead
      # of pulling 20MB of JPEG over the network on first run. Referenced
      # in place rather than copied, so there's one source of truth.
      - path: ../../public/photos/optimized
        type: folder
        buildPhase: resources
      # The logo artwork the web app uses, referenced in place so both
      # frontends draw the same mark (see BanbeLogo).
      - path: ../../public/banbe-mark.png
        buildPhase: resources
      - path: ../../public/banbe-wordmark.png
        buildPhase: resources
      - path: ../../public/banbe-wordmark-sm.png
        buildPhase: resources
    resources:
      - BanbeApp/Resources
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banbe.ios
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: BanbeApp/Info.plist
      properties:
        CFBundleDisplayName: banbe
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "banbe uses your location to show how far events are and to filter the area picker."
        NSCameraUsageDescription: "banbe uses your camera to scan a guest's ticket QR code at check-in."
        NSFaceIDUsageDescription: "banbe uses Face ID to unlock the app for a returning signed-in user."
        # Opens a shared photo's organizer link straight in the app —
        # banbe://organizer/<eventKey>. A plain https:// link can only do
        # this through Universal Links, which need an Associated Domains
        # entitlement and a real Apple Team ID; until those exist the web
        # page shared alongside it offers this scheme as an "Open" button.
        CFBundleURLTypes:
          - CFBundleURLName: com.banbe.ios
            CFBundleURLSchemes: [banbe]

  BanbeAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BanbeAppUITests
    dependencies:
      - target: BanbeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banbe.ios.uitests
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: BanbeApp
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  BanbeApp:
    build:
      targets:
        BanbeApp: all
        BanbeAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BanbeAppUITests
