name: BanbeApp
options:
  bundleIdPrefix: com.banbe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Debug (default, free/personal team): ENABLE_PUSH=NO, entitlements omit
# aps-environment entirely (BanbeApp.entitlements) — real-device builds
# sign fine with automatic/personal-team provisioning.
# Release (paid team only): ENABLE_PUSH=YES, entitlements declare
# aps-environment (BanbeAppPush.entitlements). See
# .claude/notes/07-notifications.md for exactly what to flip once a paid
# Apple Developer account exists — it's these two files, not this one.
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.24.0

targets:
  BanbeApp:
    type: application
    platform: iOS
    sources:
      - path: BanbeApp
        excludes:
          - "**/.DS_Store"
      # The catalogue's photos, as the WebP derivatives produced by
      # Tools/optimize-photos.sh (~5MB for all 66). They ship with the app
      # for the same reason events.json does — it's the same static
      # catalogue — so the feed paints instantly and works offline instead
      # of pulling 20MB of JPEG over the network on first run. Referenced
      # in place rather than copied, so there's one source of truth.
      - path: ../../public/photos/optimized
        type: folder
        buildPhase: resources
      # The logo artwork the web app uses, referenced in place so both
      # frontends draw the same mark (see BanbeLogo).
      - path: ../../public/banbe-mark.png
        buildPhase: resources
      - path: ../../public/banbe-wordmark.png
        buildPhase: resources
      - path: ../../public/banbe-wordmark-sm.png
        buildPhase: resources
    resources:
      - BanbeApp/Resources
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banbe.ios
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # A real Apple Developer Team ID goes here once you have a PAID
        # account — a free/personal team works fine for everything else
        # (automatic signing installs to a real device), it just can't
        # provision Push Notifications (see Config/*.xcconfig, which is
        # where CODE_SIGN_ENTITLEMENTS/ENABLE_PUSH actually get set, per
        # config — not here, so they can differ between Debug and Release).
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: BanbeApp/Info.plist
      properties:
        CFBundleDisplayName: banbe
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "banbe uses your location to show how far events are and to filter the area picker."
        NSCameraUsageDescription: "banbe uses your camera to scan a guest's ticket QR code at check-in."
        NSFaceIDUsageDescription: "banbe uses Face ID to unlock the app for a returning signed-in user."
        NSCalendarsFullAccessUsageDescription: "banbe adds an event to your calendar when you tap \"Add to Calendar\" on a ticket."
        # Opens a shared photo's organizer link straight in the app —
        # banbe://organizer/<eventKey>. A plain https:// link can only do
        # this through Universal Links, which need an Associated Domains
        # entitlement and a real Apple Team ID; until those exist the web
        # page shared alongside it offers this scheme as an "Open" button.
        CFBundleURLTypes:
          - CFBundleURLName: com.banbe.ios
            CFBundleURLSchemes: [banbe]
        # Task 1 (this session): portrait-only, no rotation — no view
        # controller/AppState override needed to match (confirmed by grep:
        # nothing in this app ever overrides
        # `supportedInterfaceOrientations`), this key alone is authoritative.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait

  BanbeAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BanbeAppUITests
    dependencies:
      - target: BanbeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banbe.ios.uitests
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: BanbeApp
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  BanbeApp:
    build:
      targets:
        BanbeApp: all
        BanbeAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BanbeAppUITests
