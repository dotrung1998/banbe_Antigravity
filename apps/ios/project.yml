name: BanbeApp
options:
  bundleIdPrefix: com.banbe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.24.0

targets:
  BanbeApp:
    type: application
    platform: iOS
    sources:
      - path: BanbeApp
        excludes:
          - "**/.DS_Store"
    resources:
      - BanbeApp/Resources
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banbe.ios
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: BanbeApp/Info.plist
      properties:
        CFBundleDisplayName: banbe
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "banbe uses your location to show how far events are and to filter the area picker."
        NSCameraUsageDescription: "banbe uses your camera to scan a guest's ticket QR code at check-in."
        NSFaceIDUsageDescription: "banbe uses Face ID to unlock the app for a returning signed-in user."
