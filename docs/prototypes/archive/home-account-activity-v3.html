<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>banbe Home v3 compare</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Compare page: v3.1 and v3.2 side by side as tabs. Each version is its own file next to this one. */
:root{ --bg:#E4DED0; --fg:#1B1916; --fg3:rgba(27,25,22,.64); --block:#EEE8DA; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--fg)}
.bar{height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid rgba(27,25,22,.12)}
.bar b{font-weight:600;font-size:15px}
.tabs{display:flex;background:var(--block);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--fg3);height:34px;padding:0 18px;border-radius:999px;cursor:pointer}
.tabs button.on{background:var(--fg);color:#F7F4EC}
.hint{font-size:12.5px;color:var(--fg3);margin-left:auto}
iframe{display:block;width:100%;height:calc(100vh - 56px);border:0}
@media (max-width:600px){ .hint{display:none} }
</style>
</head>
<body>
<div class="bar"><b>banbe Home v3</b>
  <div class="tabs" role="tablist">
    <button role="tab" data-v="3.1">v3.1</button>
    <button role="tab" data-v="3.2">v3.2</button>
  </div>
  <span class="hint">Each tab is a separate prototype file. Your choice is kept in the address (#v3.1 or #v3.2).</span>
</div>
<iframe id="f" title="Prototype"></iframe>
<script>
const f = document.getElementById('f');
const tabs = [...document.querySelectorAll('.tabs button')];
function show(v){
  f.src = `home-account-activity-v${v}.html`;
  tabs.forEach(b => { b.classList.toggle('on', b.dataset.v === v); b.setAttribute('aria-selected', b.dataset.v === v); });
  history.replaceState(null, '', '#v' + v);
}
tabs.forEach(b => b.addEventListener('click', () => show(b.dataset.v)));
show(location.hash === '#v3.1' ? '3.1' : '3.2');
</script>
</body>
</html>
