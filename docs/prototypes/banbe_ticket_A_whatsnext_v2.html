body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--page);color:var(--ink);min-height:100vh;display:flex;gap:40px;padding:28px;justify-content:center;align-items:flex-start}

.sub{font-size:13px;color:var(--ink2);line-height:1.5;margin:6px 0 4px}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:16px 0 8px;font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:7px}
.seg button .sw{width:9px;height:9px;border-radius:50%}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.screen{width:393px;height:852px;border-radius:54px;overflow:hidden;background:var(--paper);position:relative}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:36px;border-radius:20px;background:#000;z-index:80}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 44px;font-weight:600;font-size:16px;z-index:70;pointer-events:none}

.pad{padding:0 22px}
.display{font-family:Jost,'Be Vietnam Pro',sans-serif;font-weight:600;letter-spacing:-.02em}
.back{display:flex;align-items:center;gap:6px;font-size:15px;padding:10px 22px 0}
.small{font-size:12px;color:var(--ink2)}
.card{background:var(--block)}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:600;letter-spacing:.14em}
.btn{border:0;border-radius:16px;padding:13px 10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--block);color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--rule)}

.ico{width:19px;height:19px;flex:none}

.qr{background:#fff;border-radius:14px;padding:10px;position:relative;display:inline-block;line-height:0}
.qr svg{display:block;transition:filter .3s}.qr.lock svg{filter:blur(7px) opacity(.5)}
.qr .ov{position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.3;font-size:13px;font-weight:600;padding:12px}
.notch{position:absolute;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--paper)}
.next{--t:var(--mist);position:relative;display:flex;align-items:center;gap:10px;width:100%;border:0;font:inherit;text-align:left;cursor:pointer;color:var(--ink);padding:9px 12px;border-radius:14px;background:color-mix(in srgb,var(--t) 13%,transparent);transition:background .2s}

.next .tx{flex:1;min-width:0;line-height:1.25}
.next .h{font-size:13px;font-weight:600;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next .s{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.more>div{overflow:hidden}
.more p{font-size:12.5px;line-height:1.5;color:var(--ink2);padding:8px 4px 2px}
.more .lnk{font-size:12.5px;font-weight:600;color:var(--t);padding:2px 4px 0;display:inline-flex;gap:4px;align-items:center}
.dotp{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--t);margin-right:6px}

.evt{cursor:pointer;border-radius:16px;padding:8px;margin:0 -0px;transition:background .15s,transform .15s}
.evt:active{background:color-mix(in srgb,var(--ink) 7%,transparent);transform:scale(.99)}
.evlink{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--ink);background:var(--inset);border-radius:999px;padding:5px 6px 5px 11px;flex:none}
.evlink svg{width:7px;height:11px}
/* event sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;height:86%;background:var(--paper);border-radius:30px 30px 0 0;z-index:65;transform:translateY(102%);transition:transform .38s cubic-bezier(.22,.61,.36,1);display:flex;flex-direction:column;box-shadow:0 -12px 40px rgba(0,0,0,.25)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--rule);margin:9px auto 0}
.sheet .sc{flex:1;overflow-y:auto;padding:10px 22px 24px;scrollbar-width:none}.sheet .sc::-webkit-scrollbar{display:none}
.xbtn{position:absolute;right:16px;top:16px;width:32px;height:32px;border-radius:50%;background:var(--block);border:0;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--block);border-radius:999px;padding:7px 12px;font-size:12.5px}
.sec{margin-top:20px}.sec .t{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:8px}
.sheetbar{padding:12px 22px 30px;border-top:1px solid var(--rule);background:var(--paper);display:flex;gap:10px}
.fade{animation:in .3s both}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:900px){body{flex-direction:column;align-items:center}.panel{position:static}}

  <div class="small" style="margin-top:14px;font-weight:600;color:var(--clay)">${T('Chi tiết sự kiện','Event details')}</div>
  <h2 class="display" style="font-size:27px;line-height:1.12;margin-top:2px">Nói Chuyện: Giấy</h2>
  <div style="display:flex;gap:8px;margin-top:14px"><div class="tile"><div class="k">${T('Ngày','Date')}</div><div class="v">${T('Thứ Tư 28/10','Wed 28 Oct')}</div></div><div class="tile"><div class="k">${T('Giờ','Time')}</div><div class="v">20:00</div></div><div class="tile"><div class="k">${T('Địa điểm','Place')}</div><div class="v">Quận 1</div></div></div>
  <div class="sec"><div class="t">${T('Giới thiệu','About')}</div><p style="font-size:14px;line-height:1.55">${T('Một buổi nói chuyện nhỏ quanh chất liệu giấy: làm, gấp, giữ và bỏ đi. (Nội dung mẫu, sẽ lấy từ mô tả sự kiện.)','A small talk about paper: making, folding, keeping and letting go. (Sample copy; will come from the event description.)')}</p></div>
  <div class="sec"><div class="t">${T('Bao gồm','Included')}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip">☕ ${T('Một đồ uống','One drink')}</span><span class="chip">📄 ${T('Bộ giấy thử','Paper kit')}</span><span class="chip">🎟 16+</span></div></div>
  <div class="sec"><div class="t">Host</div><div class="card" style="border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px"><div style="width:38px;height:38px;border-radius:50%;background:var(--clay);color:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:600">B</div><div style="flex:1"><div style="font-size:14px;font-weight:600">banbe host</div><div class="small">${T('Nhắn host nếu cần biết thêm','Message the host with questions')}</div></div><button class="btn" style="width:auto;padding:9px 12px;background:var(--inset)">${P.msg}</button></div></div>
  <div class="sec"><div class="t">${T('Địa điểm','Location')}</div><div class="card" style="border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px"><span style="color:var(--clay)">${P.pin}</span><div style="flex:1"><div style="font-size:14px;font-weight:600">Quận 1, TP.HCM</div><div class="small">${T('Địa chỉ chính xác nằm ở lời nhắn của host','Exact address is in the host\'s note')}</div></div></div></div>
  <div class="sec"><div class="t">${T('Hoàn tiền','Refunds')}</div><p style="font-size:13px;line-height:1.55;color:var(--ink2)">${T('banbe không thu tiền. Nếu host hủy sự kiện, host chịu trách nhiệm hoàn tiền cho bạn.','banbe doesn\'t collect money. If the host cancels, they are responsible for your refund.')}</p></div>
 </div>
 <div class="sheetbar"><button class="btn pri" id="openev">${ended?T('Xem trang sự kiện','View event page'):T('Mở trang sự kiện đầy đủ','Open full event page')} ›</button><button class="btn" style="width:56px;flex:none">${P.pin}</button></div>`}
function render(){
 document.body.classList.toggle('dark',S.dark);const c=C[S.c];
 const locked=['lock','past','void'].includes(c.qr);
 const nextStrip=`<button class="next ${c.solid?'solid':''} ${S.open?'open':''}" style="--t:var(--${c.tone})" id="nx"><span class="ic">${P[c.ic]}</span><span class="tx"><div class="h">${T(...c.h)}</div><div class="s">${T(...c.s)}</div></span>${c.tail?`<span class="tail">${c.tail}</span>`:''}<span class="cv">${P.cv}</span></button>
 <div class="more ${S.open?'open':''}" style="--t:var(--${c.tone})"><div><p>${T(...c.d)}</p><span class="lnk">${T(...c.l)} ›</span></div></div>`;
 const code=locked?'••• •••':'1B1 59C';
 document.getElementById('content').innerHTML=`<div class="back">${P.back}<span>${T('Thông báo','Notifications')}</span></div>
 <div class="pad fade" style="padding-top:12px"><div style="display:flex;justify-content:space-between;align-items:center"><span class="display" style="font-size:15px;opacity:.7">banbe</span><span style="font-size:11.5px;font-weight:600;color:var(--${c.tone});display:flex;align-items:center"><span class="dotp" style="--t:var(--${c.tone})"></span>${T(...c.lab)}</span></div>
 <div style="margin-top:12px;position:relative;filter:drop-shadow(0 10px 24px rgba(27,25,22,.12))">
  <div class="card" style="border-radius:24px 24px 0 0;padding:12px 12px 18px"><div style="margin-bottom:8px">${nextStrip}</div>
   <div class="evt" id="evt" role="button" tabindex="0"><div style="display:flex;justify-content:space-between;align-items:center"><div class="small" style="font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:10.5px;color:var(--ink3)">${T('Vé của','Ticket for')} Trung</div><span class="evlink">${T('Xem sự kiện','View event')}<span style="width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center">${P.cv}</span></span></div>
   <h2 class="display" style="font-size:29px;line-height:1.1;margin-top:6px">Nói Chuyện: Giấy</h2>
   <div style="display:flex;gap:8px;margin-top:14px"><div class="tile"><div class="k">${T('Ngày','Date')}</div><div class="v">28 ${T('tháng 10','Oct')}</div></div><div class="tile"><div class="k">${T('Giờ','Time')}</div><div class="v">20:00</div></div><div class="tile"><div class="k">${T('Khu vực','Area')}</div><div class="v">Quận 1</div></div></div></div></div>
  <div style="position:relative;height:0;background:var(--block)"><div class="notch" style="left:-11px"></div><div class="notch" style="right:-11px"></div></div>
  <div class="card" style="border-radius:0 0 24px 24px;padding:0 20px 22px;display:flex;flex-direction:column;align-items:center"><div style="border-top:2px dashed var(--rule);align-self:stretch;margin:0 -2px 20px"></div>${qr(200,c)}
   <div class="small" style="margin-top:14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase">${T('Mã vào cửa','Entry code')}</div><div class="code" style="font-size:29px;margin-top:2px;${locked?'opacity:.35':''}">${code}</div></div></div>
 <div style="display:flex;gap:10px;margin-top:16px"><button class="btn">${P.wal}Wallet</button><button class="btn">${P.cal2}${T('Lịch','Calendar')}</button><button class="btn" style="width:56px;flex:none">${P.pin}</button></div>
 <button class="btn ghost" style="margin-top:10px">${P.more}${T('Thêm tùy chọn','More options')}</button>
 <p style="font-size:12px;line-height:1.5;color:var(--ink3);margin-top:16px;text-align:center">${T('banbe không thu tiền. Nếu host hủy, host chịu trách nhiệm hoàn tiền.','banbe doesn\'t collect money. If the host cancels, they handle your refund.')}</p></div>`;
 document.getElementById('sheet').innerHTML=sheetHtml(c);
 document.getElementById('sheet').classList.toggle('on',S.sheet);document.getElementById('scrim').classList.toggle('on',S.sheet);
 document.getElementById('nx').onclick=()=>{S.open=!S.open;document.getElementById('nx').classList.toggle('open',S.open);document.querySelector('.more').classList.toggle('open',S.open)};
 const setSheet=v=>{S.sheet=v;document.getElementById('sheet').classList.toggle('on',v);document.getElementById('scrim').classList.toggle('on',v)};
 document.getElementById('evt').onclick=()=>setSheet(true);
 document.getElementById('evt').onkeydown=e=>{if(e.key==='Enter')setSheet(true)};
 document.getElementById('scrim').onclick=()=>setSheet(false);
 document.getElementById('xs').onclick=()=>setSheet(false);
 document.getElementById('openev').onclick=()=>setSheet(false);
 document.getElementById('why').innerHTML='<b>'+T(...c.lab)+':</b> '+WHY[S.c];
 document.getElementById('cases').innerHTML=Object.entries(C).map(([k,v])=>`<button class="${S.c===k?'on':''}" data-c="${k}"><span class="sw" style="background:var(--${v.tone})"></span>${T(...v.lab)}</button>`).join('');
 document.getElementById('prefs').innerHTML=`<button class="${!S.dark?'on':''}" data-d="0">Light</button><button class="${S.dark?'on':''}" data-d="1">Dark</button><button class="${S.lang==='vi'?'on':''}" data-l="vi">Tiếng Việt</button><button class="${S.lang==='en'?'on':''}" data-l="en">English</button>`;
}
document.addEventListener('click',e=>{const b=e.target.closest('.seg button');if(!b)return;
 if(b.dataset.c){S.c=b.dataset.c;S.open=false;S.sheet=false}else if(b.dataset.d)S.dark=b.dataset.d==='1';else if(b.dataset.l)S.lang=b.dataset.l;render()});
function fit(){const sc=Math.min(1,(innerHeight-40)/884),e=document.getElementById('scaler');e.style.transform=`scale(${sc})`;e.style.marginBottom=(884*sc-884)+'px';e.parentElement.style.width=(425*sc)+'px'}
addEventListener('resize',fit);fit();render();
</script></body></html>
