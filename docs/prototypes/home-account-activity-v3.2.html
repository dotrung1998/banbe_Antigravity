<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>banbe Home and Account v3.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Prototype only, v3. v1 layout (photo-first Home, hairline settings) + v2/app details (search bar, rounded tabs, pill
   dock now with labels, the app's real Hosting home). Tokens from src/index.css. Nothing is wired to the codebase. */
:root{
  --bg:#F7F4EC; --fg:#1B1916; --fg2:rgba(27,25,22,.72); --fg3:rgba(27,25,22,.64);
  --rule:rgba(27,25,22,.16); --divider:rgba(27,25,22,.10); --block:#EEE8DA; --inset:#FBF8F1; --s1:#FBF8F1;
  --alert:#9A3E2D; --onalert:#fff; --clay:#9C5B3B; --moss:#4E6A30; --honey:#8C6014; --plum:#6B4E7C;
  --sel:#FFFFFF; --stage:#E4DED0; --dockShadow:0 6px 24px rgba(27,25,22,.14);
}
:root[data-theme="dark"]{
  --bg:#0F0E0B; --fg:#F2EDE1; --fg2:rgba(242,237,225,.72); --fg3:rgba(242,237,225,.56);
  --rule:rgba(242,237,225,.18); --divider:rgba(242,237,225,.10); --block:#1A1815; --inset:#24211C; --s1:#1A1815;
  --alert:#E8715B; --onalert:#0F0E0B; --clay:#D8926C; --moss:#A9C487; --honey:#F2C46D; --plum:#BBA2D0;
  --sel:#F2EDE1; --stage:#050504; --dockShadow:0 6px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--stage);color:var(--fg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg.i{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.stage{min-height:100%;display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:32px 16px}

/* side panel */
.panel{width:360px;flex:none;position:sticky;top:32px}
.panel h1{font-weight:300;font-size:28px;letter-spacing:-.01em;margin:0 0 4px}
.panel .lede{font-size:13px;color:var(--fg2);line-height:1.5;margin:0 0 18px}
.ctl{margin-bottom:14px}
.ctl label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);margin-bottom:6px}
.notes{border-top:1px solid var(--rule);padding-top:16px;margin-top:6px}
.notes h2{font-size:15px;font-weight:500;margin:0 0 10px}
.notes ul{margin:0;padding-left:18px;font-size:13px;line-height:1.55;color:var(--fg2)}
.notes li{margin-bottom:6px}
.notes b{color:var(--fg);font-weight:600}

/* rounded tabs, app style (Going out | Hosting switch) */
.rtabs{display:flex;background:var(--block);border-radius:999px;padding:3px}
.rtabs button{flex:1;height:38px;border-radius:999px;font-size:14px;font-weight:600;color:var(--fg3);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.rtabs button.on{background:var(--fg);color:var(--bg)}
.rtabs .n{min-width:18px;height:18px;border-radius:999px;background:var(--alert);color:var(--onalert);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.rtabs.sm button{height:32px;font-size:12px;font-weight:500}

/* phone */
.phone{width:390px;height:844px;flex:none;border-radius:52px;background:#141310;padding:10px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.device{position:relative;width:100%;height:100%;border-radius:43px;overflow:hidden;background:var(--bg)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:60}
.status{position:absolute;top:0;left:0;right:0;height:54px;z-index:55;display:flex;justify-content:space-between;align-items:center;padding:4px 32px 0 36px;font-size:15px;font-weight:600;pointer-events:none;color:var(--fg)}
.status.light{color:#fff}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:116px}
.screen::-webkit-scrollbar{display:none}

/* dock: the app's pill + centre "+", now with labels */
.dock{position:absolute;left:12px;right:12px;bottom:16px;height:72px;border-radius:999px;background:var(--s1);box-shadow:var(--dockShadow);display:flex;align-items:center;justify-content:space-between;padding:0 6px;z-index:30}
.dk{width:66px;height:62px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;color:var(--fg);font-size:11px;font-weight:500}
.dk svg{width:24px;height:24px;opacity:.75}
.dk span.l{opacity:.75}
.dk.on{background:var(--sel);box-shadow:0 2px 10px rgba(27,25,22,.12);color:#1B1916;font-weight:700}
.dk.on svg,.dk.on span.l{opacity:1}
.dk.on svg{stroke-width:2}
.dk .plus{width:26px;height:26px;margin:-1px 0;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.dk .plus svg{opacity:1;width:16px;height:16px;stroke-width:2.2}
.dk .av{width:24px;height:24px;border-radius:50%;background:var(--clay);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.badge{position:absolute;top:3px;right:12px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--alert);color:var(--onalert);font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1}

/* ---------- Home (v1 hero) ---------- */
.hero{position:relative;background:#16140f;color:#fff;overflow:hidden}
.hero-bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(18px) brightness(.45) saturate(.9);transform:scale(1.1);transition:background-image .5s}
.hero-bg.plain{background:linear-gradient(180deg,#2b2721,#16140f);filter:none}
.hero-in{position:relative;z-index:2;padding:56px 0 0}
.hrow{display:flex;justify-content:space-between;align-items:center;height:48px;padding:0 20px}
.wm{height:30px;filter:invert(1)}
.hbtns{display:flex;gap:2px;align-items:center}
.hbtn{width:42px;height:42px;display:grid;place-items:center;position:relative}
.hbtn svg{width:24px;height:24px}
.hbtn .pip{position:absolute;top:7px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--alert);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px #16140f}
.hbtn .face{width:32px;height:32px;border-radius:50%;background:var(--clay);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.9)}
.hsearch{margin:10px 20px 0;height:46px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:10px;padding:0 16px;font-size:15px;color:rgba(255,255,255,.75);width:calc(100% - 40px);text-align:left}
.hsearch svg{width:19px;height:19px;flex:none}
.hsearch .sp{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsearch .area{flex:none;display:flex;align-items:center;gap:6px;color:#fff;font-weight:500;border-left:1px solid rgba(255,255,255,.25);padding-left:12px}
.texttabs{display:flex;gap:20px;padding:18px 24px 4px;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.texttabs::-webkit-scrollbar{display:none}
.texttabs button{flex:none;font-size:17px;font-weight:300;color:rgba(255,255,255,.58);padding:6px 0;display:flex;align-items:center;gap:5px;position:relative}
.texttabs button.on{color:#fff;font-weight:500}
.texttabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:#fff;border-radius:2px}
.texttabs svg{width:13px;height:13px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:20px 24px 0;scrollbar-width:none;scroll-padding-left:24px}
.rail::-webkit-scrollbar{display:none}
.ecard{flex:0 0 268px;height:360px;border-radius:16px;position:relative;overflow:hidden;scroll-snap-align:start;background:#2a2620 center/cover;text-align:left;color:#fff;transition:transform .3s,opacity .3s}
.ecard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.05) 50%,rgba(0,0,0,.78) 100%)}
.ecard.dim{opacity:.6}
.ecard .top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:2}
.gpill{height:28px;padding:0 10px;border-radius:999px;background:rgba(247,244,236,.85);color:#1B1916;font-size:11.5px;font-weight:700;display:flex;align-items:center;letter-spacing:.02em}
.ecard .cp{position:absolute;left:16px;right:16px;bottom:16px;z-index:2}
.ecard .eb{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.ecard h3{font-size:26px;font-weight:300;line-height:1.12;margin:6px 0 6px;letter-spacing:-.01em}
.ecard .mt{font-size:13px;opacity:.9;display:flex;justify-content:space-between;gap:8px}
.ecard.more{background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:15px}
.ecard.more::after{display:none}
.ecard.more svg{width:28px;height:28px}
.hcta{padding:18px 24px 0;display:flex;gap:10px}
.cta{flex:1;height:48px;border-radius:999px;font-size:15px;font-weight:500}
.cta.solid{background:#fff;color:#111}
.cta.ghost{border:1px solid rgba(255,255,255,.85);color:#fff}
.bars{display:flex;justify-content:center;gap:6px;padding:18px 0 22px}
.bars button{width:20px;height:3px;background:rgba(255,255,255,.32);border-radius:2px}
.bars button.on{width:30px;background:#fff}
.sec{padding:28px 20px 0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.sec-h h3{font-size:19px;font-weight:400;margin:0;letter-spacing:-.01em}
.sec-h button{font-size:13px;color:var(--fg2)}
.nextup{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--rule);border-radius:14px;width:100%;text-align:left}
.datebox{width:46px;text-align:center;border-right:1px solid var(--rule);padding-right:12px}
.datebox small{display:block;font-size:10px;letter-spacing:.1em;color:var(--fg3)}
.datebox b{font-size:22px;font-weight:300}
.nextup .t{flex:1;min-width:0}
.nextup .t div{font-size:15px}
.nextup .t span{font-size:12px;color:var(--moss)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--divider);border-left:1px solid var(--divider)}
.cats button{height:84px;border-right:1px solid var(--divider);border-bottom:1px solid var(--divider);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--fg2)}
.cats svg{width:26px;height:26px;color:var(--fg)}
.lrail{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:0 20px;scrollbar-width:none}
.lrail::-webkit-scrollbar{display:none}
.lcard{flex:0 0 200px;text-align:left}
.lcard .ph{height:230px;border-radius:14px;background:var(--block) center/cover}
.lcard .n{font-size:15px;margin-top:10px}
.lcard .m{font-size:12px;color:var(--fg3);margin-top:3px}

/* ---------- Hosting home (the app's current view, note 69/71) ---------- */
.hh{padding:20px 20px 0}
.hcard{border-radius:16px;background:var(--block);padding:18px}
.hcard h2{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.hcard .sub{font-size:14px;color:var(--fg2);margin-top:4px}
.hbig{height:48px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:16px;font-weight:700;width:100%;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.hbig svg{width:18px;height:18px;stroke-width:2}
.hbig.light{background:var(--inset);color:var(--fg)}
.hrowbtns{display:flex;gap:8px;margin-top:12px}
.hrowbtns .hbig{margin-top:0;flex:1;font-size:14px;height:44px}
.seats{height:8px;border-radius:999px;background:var(--inset);margin-top:12px;overflow:hidden}
.seats i{display:block;height:100%;background:var(--moss);border-radius:999px}
.hnext{display:flex;gap:14px;align-items:center}
.hnext .ph{width:64px;height:64px;border-radius:12px;background:center/cover;flex:none}
.hquick{display:flex;gap:10px;overflow-x:auto;padding:16px 20px 0;scrollbar-width:none}
.hquick::-webkit-scrollbar{display:none}
.hq{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--fg2);position:relative}
.hq .sq{width:56px;height:56px;border-radius:16px;background:var(--block);display:grid;place-items:center;color:var(--fg)}
.hq .sq svg{width:22px;height:22px;stroke-width:1.75}
.hq .badge{top:-4px;right:-2px}
.hsec{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}
.hsec h3{font-size:19px;font-weight:700;margin:0}
.hsec svg{width:16px;height:16px;color:var(--fg2)}
.action{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--alert) 9%,var(--block));margin-top:10px;width:100%;text-align:left}
.action svg{width:20px;height:20px;color:var(--alert);flex:none}
.action span{flex:1;font-size:15px;font-weight:600}
.action small{display:block;font-weight:400;color:var(--fg2);font-size:13px}
.action .go{white-space:nowrap;display:grid;place-items:center;height:34px;padding:0 14px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:13px;font-weight:700;flex:none}
.clist{border-radius:16px;background:var(--block);overflow:hidden}
.crow{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative;width:100%;text-align:left}
.crow+.crow::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--divider)}
.crow .d{width:44px;text-align:center;font-size:11px;font-weight:700;color:var(--fg3);letter-spacing:.04em}
.crow .d b{display:block;font-size:20px;color:var(--fg);letter-spacing:0}
.crow > svg{width:16px;height:16px;color:var(--fg3);flex:none}
.crow .t{flex:1;font-size:15px;font-weight:600}
.crow .t small{display:block;font-weight:400;font-size:13px;color:var(--fg3)}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.t3{height:88px;border-radius:16px;background:var(--block);padding:16px;text-align:left;display:flex;flex-direction:column;justify-content:center}
.t3 b{font-size:20px;font-weight:600}
.t3 span{font-size:13px;color:var(--fg2);margin-top:2px}
.lock{border:1.5px dashed var(--rule);border-radius:16px;padding:20px}
.lock h2{font-size:22px;font-weight:700;margin:0 0 6px}
.lock p{font-size:15px;color:var(--fg2);line-height:1.5;margin:0}
.lock ul{margin:14px 0 0;padding:0;list-style:none;font-size:14px;color:var(--fg2)}
.lock li{display:flex;gap:10px;align-items:center;padding:6px 0}
.lock li svg{width:18px;height:18px;color:var(--moss);stroke-width:2}

/* ---------- v1 page head, rows, groups ---------- */
.ph-head{position:sticky;top:0;z-index:10;background:var(--bg);padding:56px 20px 0}
.ph-row{display:flex;justify-content:space-between;align-items:center;height:48px}
.ph-row h1{font-size:30px;font-weight:300;margin:0;letter-spacing:-.01em}
.ph-row .acts{display:flex;gap:2px}
.iconbtn{width:42px;height:42px;display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}
.back{display:flex;align-items:center;gap:2px;font-size:15px;color:var(--fg2);height:44px}
.back svg{width:20px;height:20px}
.list{margin:0 20px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--divider);min-height:56px}
.row .ic{width:24px;height:24px;flex:none;color:var(--fg)}
.row .lbl{flex:1;min-width:0;font-size:15px}
.row .lbl small{display:block;font-size:12px;color:var(--fg3);margin-top:2px}
.row .val{font-size:13px;color:var(--fg3);white-space:nowrap}
.row .cnt{min-width:20px;height:20px;border-radius:999px;background:var(--alert);color:var(--onalert);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.row .chev{width:16px;height:16px;color:var(--fg3);flex:none}
.grp-h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);margin:30px 20px 4px}
.entity{display:flex;align-items:center;gap:16px;padding:8px 20px 0;width:100%;text-align:left}
.entity .avc{width:64px;height:64px;border-radius:50%;background:var(--clay);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:500;flex:none}
.entity .nm{font-size:22px;font-weight:300}
.entity .hd{font-size:13px;color:var(--fg3);margin-top:2px}
.entity .lnk{font-size:13px;color:var(--fg);margin-top:6px;display:inline-flex;align-items:center;gap:2px;border-bottom:1px solid var(--rule)}
.entity .lnk svg{width:13px;height:13px}
.tabwrap{margin:20px 20px 0}
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 20px 0;border-top:1px solid var(--divider);border-bottom:1px solid var(--divider)}
.shortcuts button{padding:16px 0 14px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--fg2);position:relative}
.shortcuts svg{width:26px;height:26px;color:var(--fg)}
.shortcuts .badge{right:14px;top:8px}
.attn{margin:16px 20px 0;display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--block);border-radius:14px;width:calc(100% - 40px);text-align:left;font-size:14px}
.attn svg{width:20px;height:20px;flex:none}
.attn span{flex:1}
.signout{display:flex;align-items:center;justify-content:center;gap:8px;margin:30px 20px 0;width:calc(100% - 40px);height:48px;border:1.5px solid var(--alert);border-radius:999px;color:var(--alert);font-size:15px;font-weight:600}
.signout svg{width:18px;height:18px;stroke-width:2}
.ver{text-align:center;font-size:11px;color:var(--fg3);margin:14px 0 10px}
.guestcard{margin:12px 20px 0;padding:24px 20px;border:1px solid var(--rule);border-radius:16px}
.guestcard h2{font-size:22px;font-weight:300;margin:0 0 6px}
.guestcard p{font-size:14px;color:var(--fg2);margin:0 0 18px;line-height:1.5}
.btn{height:48px;width:100%;font-size:15px;border-radius:999px;font-weight:600}
.btn.solid{background:var(--fg);color:var(--bg)}
.btn.ghost{border:1px solid var(--fg);margin-top:10px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--rule);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--fg)}
.sw.on::after{transform:translateX(18px)}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--rule);flex:none;display:grid;place-items:center}
.radio.on{border-color:var(--fg)}
.radio.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--fg)}
.inl{display:flex;background:var(--block);border-radius:999px;padding:2px}
.inl button{height:30px;padding:0 11px;border-radius:999px;font-size:12px;color:var(--fg2)}
.inl button.on{background:var(--fg);color:var(--bg);font-weight:600}

/* Activity (v1, rounded tabs and chips) */
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;background:var(--block);font-size:13px;color:var(--fg2)}
.chip.on{background:var(--fg);color:var(--bg);font-weight:600}
.thread{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--divider);width:100%;text-align:left;align-items:center}
.tav{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:16px;font-weight:500;color:#fff;background:center/cover}
.thread .b{flex:1;min-width:0}
.thread .tp{display:flex;justify-content:space-between;gap:8px}
.thread .nm{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread .tm{font-size:12px;color:var(--fg3);flex:none}
.thread .lm{display:block;font-size:13px;color:var(--fg2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* sheet */

const leftN = e => e.sold ? 0 : (/^(\d+) left/.exec(e.left)||[0,99])[1]*1;
function passF(e, ignoreCats, f=S.f){
  const d=e.day;
  if (f.date==='today' && d!==TODAY) return false;

  if (f.date==='week' && d>=TODAY+7) return false;
  if (f.date.startsWith('on:') && d!==Number(f.date.slice(-2))) return false;
  if (f.free && e.p) return false;
  if (f.priceMin!=null && e.p<f.priceMin) return false;
  if (f.priceMax!=null && e.p>f.priceMax) return false;
  if (!ignoreCats && f.cats.length && !f.cats.includes(e.cat)) return false;
  if (f.forYou && !PICKS.includes(e.cat)) return false;
  if (f.area!=='all' && e.area!==f.area) return false;
  if (f.hideSold && e.sold) return false;
  if (f.almostFull && !(leftN(e)>0 && leftN(e)<=3)) return false;
  return true; }
const sortL = l => l.sort(S.sort==='popular' ? (a,b)=>leftN(a)-leftN(b) : S.sort==='price' ? (a,b)=>a.p-b.p : (a,b)=>a.day-b.day||a.time.localeCompare(b.time));
const fCount = (f=S.f) => (f.date!=='any')+(f.priceMin!=null||f.priceMax!=null)+(f.free?1:0)+(f.cats.length>0)+(f.hideSold?1:0)+(f.almostFull?1:0)+(f.forYou?1:0)+(f.area!=='all');

/* "See all" (a top tab) and a Browse type: one list screen with the Filters button, day groups, no divider lines. */
function listBase(){

function listView(){

  if (mixed && S.lcat!=='all') l=l.filter(e=>e.cat===S.lcat);
  sortL(l);

      ${sub?`<p class="lsub">${sub}${L.key==='foryou'?` · <button data-a="toast" data-v="Opens Event preferences">Edit my picks</button>`:''}</p>`:''}</div>`;

  const chips = `<div class="lchips">${fBtn('fchip')}${qc}</div>`;

  const saveBtn = e => `<button class="save ${S.saved.has(e.id)?'on':''}" data-a="save" data-v="${e.id}" aria-label="${S.saved.has(e.id)?'Saved':'Save'} ${e.t}">${ic('bookmark')}</button>`;
  const body = !base.length
    ? `<div class="lempty"><span class="lt-ic big">${ic(icon||'grid')}</span><h3>No ${title.toLowerCase()} events yet</h3><p>Follow this type and we will tell you when a host posts one.</p><button class="pbtn dark" data-a="toast" data-v="You will hear about new ${title} events">Notify me</button></div>`
    : !l.length
    ? `<div class="lempty"><h3>Nothing here yet</h3><p>No ${title.toLowerCase()} events match your filters. Try another day, or clear them.</p><button class="pbtn dark" data-a="lclear">Clear filters</button></div>`
    : S.lview==='cards'
      ? `<div class="lgrid">${l.map(e=>`<div class="gcard"><button class="gph" data-a="toast" data-v="Opens ${e.t}" style="background-image:url('${PH+e.img}')"><span class="gpill">${e.d}</span></button>${saveBtn(e)}<div class="gt">${e.t}</div><div class="gm">${e.area} · ${e.pr}</div></div>`).join('')}</div>`

          <span class="eb2">${mixed?`<span class="ecat">${CATS[e.cat].l}</span>`:''}<span class="et">${e.t}</span><span class="em">${e.time} · ${e.area}</span><span class="em2"><b>${e.pr}</b><i class="${e.sold||/^[1-4] left/.test(e.left)?'low':''}">${e.left}</i></span></span></button>${saveBtn(e)}</div>`).join('')}`).join('');
  return head + chips + bar + `<div class="lbody">${body}</div>`;

/* Filters: the app's HomeFilterSheet (Reset · Filters · ×, live counts on every pill, price histogram with a
   two-handle range, "Show N events" or the one filter to relax), plus Hide sold out. Edits a draft; Show applies. */
function filterSheet(){
  const inList = S.sub==='list', lb = inList ? listBase() : null;
  const base = inList ? lb.base : ALL, noCats = inList && !lb.mixed;
  const fd = S.fd, cnt = patch => base.filter(e=>passF(e, noCats, {...fd, ...patch})).length;
  const result = cnt({}), total = base.length;
  const hint = result ? null : RELAX.find(([,,patch])=>cnt(patch)>0);
  const pill = (on, act, val, label, n, extra='') => `<button class="fpill ${on?'on':''}" data-a="${act}" data-v="${val}" ${!on&&n===0?'disabled':''}>${extra}${label}${n!=null?`<span class="fc">${n}</span>`:''}</button>`;
  // price histogram over the other filters
  const paid = base.filter(e=>passF(e, noCats, {...fd, priceMin:null, priceMax:null, free:false})).map(e=>e.p).filter(Boolean).sort((a,b)=>a-b);
  const max = paid.length ? Math.ceil(paid[paid.length-1]/50000)*50000 : 0;
  const lo = fd.priceMin||0, hi = fd.priceMax!=null ? fd.priceMax : max;
  const B = 14, bi = v => Math.min(B-1, Math.floor(v/max*B));
  const counts = Array(B).fill(0); paid.forEach(v=>counts[bi(v)]++);
  const peak = Math.max(1,...counts), two = S.forTwo ? 2 : 1;
  const med = paid.length ? paid[Math.floor((paid.length-1)/2)] : null;
  const inRange = paid.filter(v=>v>=lo&&v<=hi).length;
  const catLbl = fd.cats.length===1 ? CATS[fd.cats[0]].l : null;
  const ctx = [catLbl, fd.area==='all'?null:fd.area, med!=null?`median ${money(med*two)}`:null].filter(Boolean).join(' · ');
  const sec = (title, body, right='') => `<div class="fsec"><div class="fsec-h"><span>${title}</span>${right}</div>${body}</div>`;
  return `<div class="fhead"><button class="freset" data-a="freset">Reset</button><span>Filters</span><button class="fx" data-a="closeSheet" aria-label="Close">×</button></div>
  <div class="fbody">
    ${signedIn() ? sec('For You', `<div class="fnote">Only events that match your preferences.</div>`, `<button class="fsw ${fd.forYou?'on':''}" data-a="fdForYou" role="switch" aria-checked="${fd.forYou}"><i></i></button>`) : ''}
    ${sec('Location', `<button class="floc" data-a="fdAreaOpen"><span>${fd.area==='all'?'Everywhere':fd.area}</span><span>${S.areaOpen?'⌃':'›'}</span></button>
      ${S.areaOpen?`<div class="farea">${['all'].concat(AREAS).map(a=>`<button data-a="fdArea" data-v="${a}"><span>${a==='all'?'Everywhere':a}</span><span class="radio ${fd.area===a?'on':''}"></span></button>`).join('')}</div>`:''}`)}
    ${sec('When', `<div class="fwrap">${Object.keys(DATE_LABELS).map(o=>pill(fd.date===o,'fdDate',o,DATE_LABELS[o],o==='any'?null:cnt({date:o}))).join('')}
      <label class="fpick"><span class="fpill ${fd.date.startsWith('on:')?'on':''}">${fd.date.startsWith('on:')?dateLbl(fd.date):'Pick a date'}</span><input type="date" id="fpick" min="2026-11-07" max="2026-12-31" aria-label="Pick a date"></label></div>`)}
    ${sec('Price', (max ? `<div class="fnote" id="pctx">${ctx}${ctx?' · ':''}<b>${inRange} of ${paid.length} events</b></div>
      <div class="hist" id="phist">${counts.map((c,i)=>`<i style="height:${Math.max(6,c/peak*100)}%" class="${!fd.free&&i>=bi(lo)&&i<=bi(Math.max(0,hi-1))?'on':''}"></i>`).join('')}</div>
      <div class="dual"><input type="range" class="rng" id="pmin" min="0" max="${max}" step="50000" value="${lo}" aria-label="Minimum price"><input type="range" class="rng" id="pmax" min="0" max="${max}" step="50000" value="${hi}" aria-label="Maximum price"></div>
      <div class="plbl" id="plabels"><span>${lo?money(lo*two):'Free'}</span><span>${fd.priceMax!=null?money(hi*two):money(max*two)+'+'}</span></div>`
      : `<div class="fnote">No paid events match yet.</div>`) + `<div style="margin-top:12px">${pill(fd.free,'fdFree','','Free only',cnt({free:true,priceMin:null,priceMax:null}))}</div>`,
      `<button class="ftwo ${S.forTwo?'on':''}" data-a="fdTwo">${S.forTwo?'✓ ':''}Price for 2</button>`)}
    ${noCats ? '' : sec('Category', `<div class="fwrap">${BROWSE.map(k=>pill(fd.cats.includes(k),'fdCat',k,CATS[k].l,cnt({cats:[k]}),ic(CATS[k].i))).join('')}</div>`)}
    ${sec('Seats', `<button class="fsrow" data-a="fdSold"><span>Hide sold out<small>Only events you can still book</small></span><span class="fc">${cnt({hideSold:true})}</span><span class="fsw ${fd.hideSold?'on':''}"><i></i></span></button>
      <div class="fwrap" style="margin-top:10px">${pill(fd.almostFull,'fdAlmost','','Almost full',cnt({almostFull:true}))}</div>`)}
    ${sec('Sort by', `<div class="fwrap">${Object.entries(SORT_LABELS).map(([k,l])=>`<button class="fpill ${S.sortd===k?'on':''}" data-a="fdSort" data-v="${k}" ${k==='nearest'?'disabled':''}>${l}</button>`).join('')}</div><div class="fnote" style="margin-top:8px">Turn on location to sort by distance.</div>`)}
  </div>
  <div class="ffoot"><button class="fcta" id="fcta" data-a="fapply">${result ? `Show ${result} ${result===1?'event':'events'}` : hint ? `No events · try ${hint[1]}` : 'No events'}</button>
    <div class="fout">out of ${total} events</div></div>`;
}

/* "Find a type": search every event type by name, instead of an "All" bucket. */
function typesSheet(){
  return `<div class="grab"></div><div class="fs-head"><h2>Event types</h2><button data-a="closeSheet">Done</button></div>
    <div class="tsearch">${ic('search')}<input id="typeQ" placeholder="Search ${TYPES.length} types, like wine or film" value="${esc(S.typeQ)}" autocomplete="off" aria-label="Search event types"></div>
    <div id="typeList">${typeListHtml()}</div>`;
}
function typeListHtml(){
  const q=S.typeQ.trim().toLowerCase();
  const m=TYPES.filter(t=>!q||t.l.toLowerCase().includes(q));

let railRaf;
function mountRail(){
  const rail=$('rail'); if(!rail) return;
  rail.scrollLeft = S.idx * 280;
  rail.addEventListener('scroll',()=>{ cancelAnimationFrame(railRaf); railRaf=requestAnimationFrame(()=>{
    const n=homeList().length; const i=Math.max(0,Math.min(n-1,Math.round(rail.scrollLeft/280)));
    if(i!==S.idx){ S.idx=i; const sl=rail.scrollLeft; render(); const r=$('rail'); if(r) r.scrollLeft=sl; } }); });
}

  $('roleSeg').innerHTML=[['guest','Guest'],['member','Member'],['host','Host'],['admin','Admin']].map(([k,l])=>`<button class="${S.role===k?'on':''}" data-a="role" data-v="${k}">${l}</button>`).join('');
  const cur=S.sheet==='filter'?'filter':S.sheet==='types'?'types':S.sheet?'sheet':S.sub==='list'?'list':S.screen;
  $('jumpSeg').innerHTML=[['home','Home'],['sheet','Quick panel'],['activity','Activity'],['account','Account']].map(([k,l])=>`<button class="${cur===k?'on':''}" data-a="jump" data-v="${k}">${l}</button>`).join('');
  $('themeSeg').innerHTML=[['light','Light'],['dark','Dark']].map(([k,l])=>`<button class="${S.theme===k?'on':''}" data-a="theme" data-v="${k}">${l}</button>`).join('');
  const [h,items]=NOTES[cur]||NOTES.schedule;
  $('notes').innerHTML=`<h2>${h}: what changes</h2><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
}

/* actions */
let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),1800); }
const A = {
  tab:v=>{ S.screen=v; S.sub=null; S.thread=null; },
  homeTab:v=>{ S.homeTab=v; S.idx=0; },
  homeHosting:()=>{ S.screen='home'; S.homeTab='hosting'; },
  go:v=>{ S.idx=+v; },
  openList:v=>{ const [kind,key]=v.split(':'); S.list={kind,key}; S.lcat='all'; S.from='home'; S.sub='list'; },
  lf:v=>{ S.lf=v; }, lcat:v=>{ S.lcat=v; }, lview:v=>{ S.lview=v; },
  lclear:()=>{ A.fclear(); S.lcat='all'; },
  openFilter:()=>{ S.fd=JSON.parse(JSON.stringify(S.f)); S.sortd=S.sort; S.areaOpen=false; S.sheet='filter'; },
  freset:()=>{ S.fd=DEFAULT_F(); S.sortd='soonest'; },
  fdDate:v=>{ S.fd.date=v; }, fdFree:()=>{ S.fd.free=!S.fd.free; S.fd.priceMin=null; S.fd.priceMax=null; },
  fdCat:v=>{ const c=S.fd.cats; S.fd.cats = c.includes(v) ? c.filter(x=>x!==v) : c.concat(v); },
  fdSold:()=>{ S.fd.hideSold=!S.fd.hideSold; }, fdAlmost:()=>{ S.fd.almostFull=!S.fd.almostFull; },
  fdForYou:()=>{ S.fd.forYou=!S.fd.forYou; }, fdTwo:()=>{ S.forTwo=!S.forTwo; },
  fdAreaOpen:()=>{ S.areaOpen=!S.areaOpen; }, fdArea:v=>{ S.fd.area=v; S.areaOpen=false; },
  fdSort:v=>{ S.sortd=v; },
  fapply:()=>{ const inList=S.sub==='list', lb=inList?listBase():null, base=inList?lb.base:ALL;
    const cnt = patch => base.filter(e=>passF(e, inList&&!lb.mixed, {...S.fd,...patch})).length;
    if (cnt({})) { S.f=JSON.parse(JSON.stringify(S.fd)); S.sort=S.sortd; S.sheet=false; S.idx=0; return; }
    const h = RELAX.find(([,,patch])=>cnt(patch)>0); if (h) Object.assign(S.fd, h[2]); },
  openTypes:()=>{ S.sheet='types'; S.typeQ=''; setTimeout(()=>{ const i=$('typeQ'); if(i) i.focus(); }, 340); },
  pickType:v=>{ S.sheet=false; S.list={kind:'cat',key:v}; S.lcat='all'; S.from='home'; S.sub='list'; },
  fset:v=>{ const [k,x]=v.split(':'); if (k==='date') S.f.date=x; if (k==='free'){ S.f.free=!S.f.free; S.f.priceMin=null; S.f.priceMax=null; } S.idx=0; },
  fclear:()=>{ S.f=DEFAULT_F(); S.sort='soonest'; S.idx=0; },
  hostToggle:()=>{ S.hostMode=!S.hostMode;
    if (!S.hostMode){ if(S.homeTab==='hosting') S.homeTab='foryou'; if(S.acctTab==='host') S.acctTab='personal'; if(S.sheetTab==='host') S.sheetTab='personal'; }
    else { S.sheetTab='host'; }
    toast(S.hostMode?'Hosting mode on: Hosting is now on Home and in Account':'Hosting mode off'); },
  save:v=>{ if(!signedIn()){ toast('Log in to save events'); return false; } S.saved.has(v)?S.saved.delete(v):S.saved.add(v); toast(S.saved.has(v)?'Saved':'Removed from Saved'); },
  openAct:v=>{ S.screen='activity'; S.actTab=v; S.thread=null; S.sub=null; S.sheet=false; },
  actTab:v=>{ S.actTab=v; }, msgF:v=>{ S.msgF=v; }, ntF:v=>{ S.ntF=v; },
  acctTab:v=>{ S.acctTab=v; }, sheetTab:v=>{ S.sheetTab=v; },
  openThread:v=>{ S.thread=v; S.readT.add(v); }, closeThread:()=>{ S.thread=null; },
  readNote:v=>{ S.read.add(v); },
  markAll:()=>{ feed().forEach(n=>S.read.add(n.id)); toast('All notifications marked as read'); },
  openSheet:()=>{ S.sheet='quick'; S.sheetTab=S.acctTab; }, closeSheet:()=>{ S.sheet=false; },
  goAccount:v=>{ S.sheet=false; S.screen='account'; S.sub=null; if(v) S.acctTab=v; },
  sub:v=>{ S.from=S.screen; S.sub=v; }, sheetSub:v=>{ S.sheet=false; S.from=S.screen; S.sub=v; },
  subBack:()=>{ S.sub=null; },
  theme:v=>{ S.theme=v; },
  lang:v=>{ S.lang=v; toast(v==='vi'?'Tiếng Việt (the prototype text stays in English)':'English'); },
  pref:v=>{ S.prefs[v]=!S.prefs[v]; },
  role:v=>{ S.role=v; S.hostMode=(v==='host'||v==='admin'); S.sheet=false; S.thread=null; S.sub=null; S.acctTab='personal'; if(S.homeTab==='hosting'&&!(v==='host'||v==='admin')) S.homeTab='foryou'; },
  jump:v=>{ S.sub=null; S.thread=null; if(v==='sheet'){ S.screen='home'; S.sheet='quick'; } else { S.sheet=false; S.screen=v; } },
  signin:()=>{ S.role='member'; S.sheet=false; toast('Signed in (demo)'); },
  signout:()=>{ S.role='guest'; S.sheet=false; S.screen='home'; S.homeTab='foryou'; toast('Signed out (demo)'); },
  toast:v=>{ toast(v); return false; },
};
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-a]'); if(!el) return; e.stopPropagation();
  const fn=A[el.dataset.a]; if(fn && fn(el.dataset.v)!==false) render();
});
document.addEventListener('input', e=>{
  if (e.target.id==='pmin' || e.target.id==='pmax'){
    const mn=$('pmin'), mx=$('pmax'), max=Number(mx.max); let lo=Number(mn.value), hi=Number(mx.value);
    if (e.target.id==='pmin' && lo>hi){ lo=hi; mn.value=lo; } if (e.target.id==='pmax' && hi<lo){ hi=lo; mx.value=hi; }
    S.fd.priceMin = lo>0 ? lo : null; S.fd.priceMax = hi<max ? hi : null; S.fd.free=false;
    const tmp=document.createElement('div'); tmp.innerHTML=filterSheet();
    for (const id of ['pctx','phist','plabels','fcta']) if ($(id) && tmp.querySelector('#'+id)) $(id).innerHTML = tmp.querySelector('#'+id).innerHTML;
    return; }
  if (e.target.id==='typeQ'){ S.typeQ=e.target.value; $('typeList').innerHTML=typeListHtml(); } });
document.addEventListener('change', e=>{
  if (e.target.id==='pmin' || e.target.id==='pmax') render();
  if (e.target.id==='fpick' && e.target.value){ S.fd.date='on:'+e.target.value; render(); } });
document.addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.matches('.nt[data-a]')){ e.preventDefault(); e.target.click(); }
  if(e.key==='Escape' && S.sheet){ S.sheet=false; render(); }
});
render();
</script>
