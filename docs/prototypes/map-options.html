<meta charset="utf-8">
<title>banbe Map Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Jost:wght@500;600&display=swap&subset=vietnamese">
<style>
/* Layout: a real-size iPhone on a quiet desk; option switcher above it. Phone UI uses banbe's own tokens (src/index.css). */
:root {
  --paper: #F7F4EC; --ink: #1B1916; --ink2: rgba(27,25,22,.72); --ink3: rgba(27,25,22,.58);
  --rule: rgba(27,25,22,.14); --field: #EEE8DA; --s1: #FBF8F1; --s2: #EEE8DA;
  --clay: #9C5B3B; --clay-bg: #EFE0D2; --honey: #8C6014; --honey-bg: #F0E2BE; --alert: #9A3E2D;
  --btn: #1B1916; --btn-text: #FFFFFF; --glass: rgba(251,248,241,.84); --shadow: 0 4px 18px rgba(27,25,22,.16);
  --land: #ECE6D8; --water: #B9CFD2; --park: #D8DDC2; --road: #FBF8F1; --road2: #F4EFE4; --maplabel: rgba(27,25,22,.42);
  --desk: #E4DED0; --bezel: #121110; --me: #2F6FD6;
  --f-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-display: 'Jost', 'Be Vietnam Pro', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0F0E0B; --ink: #F2EDE1; --ink2: rgba(242,237,225,.72); --ink3: rgba(242,237,225,.56);
  --rule: rgba(242,237,225,.16); --field: #24211C; --s1: #1A1815; --s2: #24211C;
  --clay: #D8926C; --clay-bg: #3B2A20; --honey: #F2C46D; --honey-bg: #3D3016; --alert: #E8715B;
  --btn: #F2EDE1; --btn-text: #0F0E0B; --glass: rgba(26,24,21,.84); --shadow: 0 4px 18px rgba(0,0,0,.5);
  --land: #1B1915; --water: #1F2F36; --park: #222819; --road: #2C2822; --road2: #24211C; --maplabel: rgba(242,237,225,.36);
  --desk: #070605; --bezel: #2A2724; --me: #6EA0F0; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0F0E0B; --ink: #F2EDE1; --ink2: rgba(242,237,225,.72); --ink3: rgba(242,237,225,.56);
  --rule: rgba(242,237,225,.16); --field: #24211C; --s1: #1A1815; --s2: #24211C;
  --clay: #D8926C; --clay-bg: #3B2A20; --honey: #F2C46D; --honey-bg: #3D3016; --alert: #E8715B;
  --btn: #F2EDE1; --btn-text: #0F0E0B; --glass: rgba(26,24,21,.84); --shadow: 0 4px 18px rgba(0,0,0,.5);
  --land: #1B1915; --water: #1F2F36; --park: #222819; --road: #2C2822; --road2: #24211C; --maplabel: rgba(242,237,225,.36);
  --desk: #070605; --bezel: #2A2724; --me: #6EA0F0; color-scheme: dark; }

html, body { height: 100%; }
body { margin: 0; background: var(--desk); color: var(--ink); font-family: var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }

/* ---------- desk chrome ---------- */
.desk { height: 100%; display: flex; flex-direction: column; align-items: center; padding-inline: 16px; box-sizing: border-box; }
.bar { width: 100%; max-width: 720px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-block: 14px 10px; }
.opts { display: flex; gap: 4px; padding: 4px; background: var(--s1); border-radius: 999px; box-shadow: var(--shadow); overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.opts button { padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--ink2); display: flex; gap: 6px; align-items: center; }
.opts button b { font-family: var(--f-display); font-weight: 600; color: var(--ink3); }
.opts button[aria-pressed="true"] { background: var(--btn); color: var(--btn-text); }
.opts button[aria-pressed="true"] b { color: inherit; opacity: .7; }
.tagline { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink2); min-height: 20px; text-align: center; }
.theme-btn { width: 30px; height: 30px; border-radius: 50%; background: var(--s1); display: grid; place-items: center; box-shadow: var(--shadow); flex: none; }
.stage { flex: 1; width: 100%; display: grid; place-items: start center; min-height: 0; overflow: clip; }
.desk { overflow: clip; }
.zin .lbls { opacity: 0; }
.lbls { transition: opacity .2s; }
.scaler { transform-origin: top center; }

/* ---------- phone ---------- */
.phone { position: relative; width: 393px; height: 852px; border-radius: 56px; background: var(--paper); overflow: hidden;
  box-shadow: 0 0 0 11px var(--bezel), 0 0 0 12px rgba(127,120,108,.5), 0 30px 60px rgba(0,0,0,.28); isolation: isolate; }
.phone.bleed { border-radius: 0; box-shadow: none; }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; border-radius: 20px; background: #000; z-index: 90; pointer-events: none; }
.status { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; justify-content: space-between; align-items: center; padding: 6px 34px 0 46px; box-sizing: border-box; font-weight: 600; font-size: 16px; z-index: 89; pointer-events: none; color: var(--ink); }
.status .ic { display: flex; gap: 6px; align-items: center; }
.homebar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--ink); z-index: 95; pointer-events: none; }
.phone.bleed .island, .phone.bleed .status, .phone.bleed .homebar { display: none; }
.screen { position: absolute; inset: 0; }

/* ---------- map ---------- */
.map { position: absolute; inset: 0; overflow: hidden; background: var(--land); touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.map:active { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; width: 1000px; height: 1000px; transform-origin: 0 0; }
.world svg { display: block; width: 1000px; height: 1000px; }
.pins { position: absolute; inset: 0; pointer-events: none; }
.pins > * { pointer-events: auto; position: absolute; }
.pin { transform: translate(-50%, -50%); height: 30px; padding: 0 10px 0 8px; border-radius: 15px; border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink);
  display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; white-space: nowrap; box-shadow: 0 2px 6px rgba(27,25,22,.3); transition: opacity .25s, transform .15s; font-variant-numeric: tabular-nums; }
.pin.sel { background: var(--ink); color: var(--paper); transform: translate(-50%, -50%) scale(1.12); z-index: 5; }
.pin.dim { opacity: .28; }
.pin .dot { position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--alert); border: 1.5px solid var(--paper); }
.pin .name { position: absolute; top: 33px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 600; color: var(--ink); text-shadow: 0 0 3px var(--land), 0 0 3px var(--land), 0 0 3px var(--land); }
.cluster { transform: translate(-50%, -50%); width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper); font-weight: 700; font-size: 14px; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(27,25,22,.3); }
.cluster.dim { opacity: .35; }
.district { transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.district .bub { min-width: 52px; height: 52px; border-radius: 26px; padding: 0 10px; box-sizing: border-box; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-family: var(--f-display); font-size: 22px; font-weight: 600; box-shadow: 0 3px 10px rgba(27,25,22,.35); }
.district .lbl { font-size: 12px; font-weight: 700; background: var(--paper); padding: 2px 8px; border-radius: 999px; box-shadow: 0 1px 4px rgba(27,25,22,.2); white-space: nowrap; }
.district.zero .bub { background: var(--s2); color: var(--ink3); }
.me { width: 16px; height: 16px; border-radius: 50%; background: var(--me); border: 3px solid #fff; box-shadow: 0 0 0 6px color-mix(in srgb, var(--me) 22%, transparent); transform: translate(-50%, -50%); pointer-events: none !important; }

/* ---------- shared phone UI ---------- */
.top { position: absolute; left: 0; right: 0; top: 54px; z-index: 20; display: flex; flex-direction: column; gap: 8px; padding: 6px 0 0; pointer-events: none; }
.top > * { pointer-events: auto; }
.bleed .top { top: 8px; }
.searchrow { display: flex; gap: 8px; padding: 0 16px; }
.search { flex: 1; height: 44px; border-radius: 22px; background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; padding: 0 16px; color: var(--ink3); font-size: 15px; }
.roundbtn { width: 44px; height: 44px; border-radius: 22px; background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: var(--shadow); display: grid; place-items: center; flex: none; position: relative; }
.roundbtn .badge { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--clay); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar, .opts::-webkit-scrollbar, .cards::-webkit-scrollbar, .dchips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 13px; border-radius: 17px; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 1px 5px rgba(27,25,22,.14);
  font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--ink); }
.chip.solid { background: var(--s2); box-shadow: none; backdrop-filter: none; }
.chip[aria-pressed="true"] { background: var(--btn); color: var(--btn-text); }
.chip .star { color: var(--honey); }
.chip[aria-pressed="true"] .star { color: inherit; }
.chip .n { opacity: .6; font-weight: 500; }

.dock { position: absolute; left: 14px; right: 14px; bottom: 24px; height: 62px; border-radius: 31px; background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: var(--shadow);
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; z-index: 60; transition: transform .3s cubic-bezier(.2,.8,.2,1), opacity .3s; }
.dock.away { transform: translateY(110px); opacity: 0; pointer-events: none; }
.dock span { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; color: var(--ink3); }
.dock span.on { color: var(--ink); }
.dock .plus { width: 44px; height: 44px; border-radius: 50%; background: var(--btn); color: var(--btn-text); display: grid; place-items: center; justify-self: center; }
.bleed .dock { bottom: 10px; }

.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--paper); border-radius: 22px 22px 0 0; box-shadow: 0 -4px 20px rgba(27,25,22,.14); z-index: 40; display: flex; flex-direction: column; will-change: transform; }
.sheet.anim { transition: transform .38s cubic-bezier(.2,.85,.25,1); }
.grab { padding: 8px 0 4px; display: grid; place-items: center; cursor: grab; touch-action: none; }
.grab i { width: 38px; height: 5px; border-radius: 3px; background: var(--rule); }
.sheet-head { touch-action: none; }
.count { display: flex; align-items: center; justify-content: space-between; padding: 2px 16px 10px; font-size: 14px; font-weight: 600; }
.count small { color: var(--ink3); font-weight: 500; font-size: 13px; }
.linkbtn { color: var(--clay); font-weight: 600; font-size: 13.5px; }
.list { overflow-y: auto; flex: 1; padding: 0 16px 120px; overscroll-behavior: contain; }

.row { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); text-align: left; width: 100%; align-items: center; }
.row img { width: 68px; height: 68px; border-radius: 12px; object-fit: cover; flex: none; background: var(--s2); }
.row .tx { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
.row .t { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { font-size: 12.5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pricel { display: flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 700; }
.seat { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--s2); color: var(--ink2); }
.seat.low { background: var(--clay-bg); color: var(--alert); }
.seat.out { background: var(--alert); color: #fff; }
.selbox { background: var(--s1); border-radius: 16px; padding: 4px 12px 12px; margin: 0 0 6px; border: 1.5px solid var(--ink); }
.selbox .row { border: 0; }
.acts { display: flex; gap: 8px; }
.acts button { flex: 1; height: 38px; border-radius: 19px; background: var(--s2); font-weight: 600; font-size: 13.5px; }
.acts button.pri { background: var(--btn); color: var(--btn-text); }
.more { font-size: 12.5px; color: var(--ink3); padding: 10px 0 2px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

.card { display: block; width: 100%; text-align: left; margin-bottom: 18px; }
.card .ph { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 4/3; background: var(--s2); }
.card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .ph .tag { position: absolute; left: 10px; top: 10px; background: rgba(15,14,11,.62); color: #fff; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; backdrop-filter: blur(6px); }
.card .ph .heart { position: absolute; right: 10px; top: 10px; width: 34px; height: 34px; border-radius: 50%; background: rgba(15,14,11,.45); color: #fff; display: grid; place-items: center; }
.card .t { font-weight: 700; font-size: 16.5px; margin-top: 9px; }
.card .meta { margin-top: 2px; }
.card .pricel { margin-top: 5px; }

/* B: carousel */
.cards { position: absolute; left: 0; right: 0; bottom: 98px; display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 26px 8px; z-index: 30; scroll-padding: 0 26px; }
.bleed .cards { bottom: 84px; }
.mcard { flex: none; width: 300px; height: 118px; scroll-snap-align: center; background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); display: flex; overflow: hidden; text-align: left; border: 1.5px solid transparent; transition: border-color .2s; }
.mcard.sel { border-color: var(--ink); }
.mcard img { width: 104px; height: 100%; object-fit: cover; flex: none; }
.mcard .tx { padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0; justify-content: center; }
.mcard .t { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { position: absolute; z-index: 35; height: 40px; padding: 0 16px; border-radius: 20px; background: var(--btn); color: var(--btn-text); font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.pill.center { left: 50%; transform: translateX(-50%); }
.pill.light { background: var(--glass); color: var(--ink); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }

/* full-screen page inside the phone */
.page { position: absolute; inset: 0; background: var(--paper); z-index: 50; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .38s cubic-bezier(.2,.85,.25,1); }
.page.open { transform: none; }
.page .list { padding-top: 6px; }
.pagehead { padding: 60px 0 8px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--rule); }
.bleed .pagehead { padding-top: 10px; }

/* C: time strip */
.timebox { margin: 0 16px; background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 18px; box-shadow: var(--shadow); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--s2); border-radius: 11px; padding: 3px; }
.seg button { height: 32px; border-radius: 9px; font-size: 13.5px; font-weight: 600; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 4px rgba(27,25,22,.18); }
.ruler { position: relative; height: 34px; }
.ruler .track { position: absolute; left: 0; right: 0; top: 14px; height: 6px; border-radius: 3px; background: var(--s2); }
.ruler .fill { position: absolute; top: 14px; height: 6px; border-radius: 3px; background: var(--clay); }
.ruler .tick { position: absolute; top: 24px; font-size: 10.5px; color: var(--ink3); transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.ruler .knob { position: absolute; top: 3px; width: 28px; height: 28px; border-radius: 50%; background: var(--paper); border: 2px solid var(--clay); transform: translateX(-50%); box-shadow: 0 2px 6px rgba(27,25,22,.25); touch-action: none; cursor: grab; }
.ruler .bubble { position: absolute; top: -22px; transform: translateX(-50%); background: var(--clay); color: #fff; font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 8px; white-space: nowrap; }
.soon { font-size: 12px; font-weight: 700; color: var(--clay); }

/* D: mini card */
.mini { position: absolute; left: 14px; right: 14px; bottom: 150px; z-index: 36; background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; display: flex; text-align: left; }
.mini img { width: 112px; height: 112px; object-fit: cover; }
.mini .tx { padding: 10px 40px 10px 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0; justify-content: center; }
.mini .t { font-weight: 700; font-size: 15.5px; }
.mini .x { position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; border-radius: 50%; background: var(--s2); display: grid; place-items: center; }

/* E: district chips */
.dchips { position: absolute; left: 0; right: 0; bottom: 100px; display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 8px; z-index: 30; }
.bleed .dchips { bottom: 84px; }
.dchip { flex: none; background: var(--paper); border-radius: 16px; box-shadow: var(--shadow); padding: 10px 14px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 112px; }
.dchip b { font-size: 15px; }
.dchip small { font-size: 12px; color: var(--ink2); }
.dchip .ico { display: flex; gap: 4px; color: var(--ink3); margin-top: 3px; }
.panel { position: absolute; left: 0; right: 0; bottom: 0; height: 46%; background: var(--paper); border-radius: 22px 22px 0 0; box-shadow: 0 -4px 20px rgba(27,25,22,.14); z-index: 40; display: flex; flex-direction: column; transform: translateY(105%); transition: transform .38s cubic-bezier(.2,.85,.25,1); }
.panel.open { transform: none; }
.panel .phead { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
.panel .phead h3 { margin: 0; font-family: var(--f-display); font-size: 22px; font-weight: 600; letter-spacing: -.02em; }

/* event detail */
.detail { position: absolute; inset: 0; z-index: 80; background: var(--paper); overflow-y: auto; transform: translateY(100%); transition: transform .4s cubic-bezier(.2,.85,.25,1); }
.detail.open { transform: none; }
.detail .hero { position: relative; height: 330px; }
.detail .hero img { width: 100%; height: 100%; object-fit: cover; }
.detail .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(10,9,7,.72)); }
.detail .back { position: absolute; top: 58px; left: 16px; width: 40px; height: 40px; border-radius: 50%; background: rgb(126,69,41,.9); color: #fff; display: grid; place-items: center; z-index: 2; }
.bleed .detail .back { top: 12px; }
.detail .htx { position: absolute; left: 18px; right: 18px; bottom: 16px; color: #fff; z-index: 2; }
.detail .htx h2 { margin: 6px 0 0; font-family: var(--f-display); font-size: 30px; font-weight: 600; letter-spacing: -.02em; line-height: 1.05; text-wrap: balance; }
.detail .htx .cat { font-size: 12.5px; font-weight: 600; background: rgba(255,255,255,.2); padding: 3px 9px; border-radius: 999px; }
.stub { margin: 16px; border-radius: 18px; background: var(--s1); border: 1px solid var(--rule); display: grid; grid-template-columns: 78px 1fr; }
.stub .date { border-right: 2px dashed var(--rule); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px 0; }
.stub .date b { font-family: var(--f-display); font-size: 30px; line-height: 1; }
.stub .date small { font-size: 12px; color: var(--ink2); font-weight: 600; }
.stub .info { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.stub .info .soon { margin-top: 2px; }
.about { padding: 0 18px 140px; font-size: 15px; line-height: 1.55; color: var(--ink2); }
.about h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink3); margin: 18px 0 6px; }
.buybar { position: sticky; bottom: 0; background: var(--paper); border-top: 1px solid var(--rule); padding: 12px 16px 34px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.buybar .pr { font-weight: 700; font-size: 17px; }
.buybar .pr small { display: block; font-weight: 500; font-size: 12.5px; color: var(--ink3); }
.buybar button { height: 48px; padding: 0 26px; border-radius: 24px; background: var(--btn); color: var(--btn-text); font-weight: 700; font-size: 15px; }

.toast { position: absolute; left: 50%; top: 110px; transform: translate(-50%, -20px); background: var(--btn); color: var(--btn-text); padding: 10px 16px; border-radius: 14px; font-size: 13.5px; font-weight: 600; z-index: 99; opacity: 0; transition: .25s; pointer-events: none; white-space: nowrap; }

    if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
    if (pts.size === 1) { const p = [...pts.values()][0]; start = { x: p.x, y: p.y, tx: v.tx, ty: v.ty }; pinch = null; return; }
    if (pts.size) return; pinch = null; start = null;
    if (!moved) tap(downT); else o.onMoveEnd && o.onMoveEnd();
  };
  host.addEventListener('pointerup', up); host.addEventListener('pointercancel', up);
  host.addEventListener('wheel', e => { e.preventDefault(); const p = local(e); zoomAt(p.x, p.y, v.s * Math.exp(-e.deltaY * 0.0018));
    clearTimeout(endT); endT = setTimeout(() => o.onMoveEnd && o.onMoveEnd(), 220); }, { passive: false });
  host.addEventListener('dblclick', e => { const p = local(e); flyTo((p.x - v.tx) / v.s, (p.y - v.ty) / v.s, Math.min(4, v.s * 1.9), p.y, () => o.onMoveEnd && o.onMoveEnd()); });
  host.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(e.target); } });
  function tap(t) {
    const pin = t.closest && t.closest('[data-pin]'), cl = t.closest && t.closest('[data-cluster]'), di = t.closest && t.closest('[data-dist]');
    if (pin) return o.onPin && o.onPin(byKey[pin.dataset.pin]);
    if (cl) { const ks = cl.dataset.cluster.split(',').map(k => byKey[k]);
      const cx = ks.reduce((a, e) => a + e.x, 0) / ks.length, cy = ks.reduce((a, e) => a + e.y, 0) / ks.length;
      return flyTo(cx, cy, Math.min(4, Math.max(v.s * 2.2, 2.8)), o.centerY && o.centerY(), () => o.onMoveEnd && o.onMoveEnd()); }
    if (di) return o.onDistrict && o.onDistrict(di.dataset.dist);
    o.onBlank && o.onBlank();
  }
  const inRect = (top, bottom) => o.events().filter(e => { const x = sx(e.x), y = sy(e.y); return x > 0 && x < W() && y > top && y < bottom; });
  render();
  return { v, render, flyTo, inRect, select(k) { selected = k; render(); }, get selected() { return selected; } };
}

/* ---------- bottom sheet with detents (velocity snap, src/lib/mapLayout.js thresholds) ---------- */
function Sheet(el, handleEls, detents, start, onSnap) {
  let cur = start, y0 = 0, t0 = 0, base = 0, last = 0, lastT = 0, dragging = false;
  const H = () => el.parentElement.offsetHeight;
  const topOf = name => detents[name]();
  const set = (top, animate) => { el.classList.toggle('anim', !!animate); el.style.transform = `translateY(${top}px)`; el.style.height = `${H() - topOf('full')}px`; el.style.top = `${topOf('full')}px`; el.style.transform = `translateY(${top - topOf('full')}px)`; };
  const snap = (name, animate = true) => { cur = name; set(topOf(name), animate); onSnap && onSnap(name); };
  const k = () => el.getBoundingClientRect().width / el.offsetWidth;
  handleEls.forEach(h => {
    h.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; dragging = true; h.setPointerCapture(e.pointerId); y0 = e.clientY; t0 = performance.now(); base = topOf(cur); last = e.clientY; lastT = t0; el.classList.remove('anim'); });
    h.addEventListener('pointermove', e => { if (!dragging) return; const top = Math.max(topOf('full'), base + (e.clientY - y0) / k()); set(top); if (performance.now() - lastT > 30) { last = e.clientY; lastT = performance.now(); } });
    const end = e => { if (!dragging) return; dragging = false; const dy = (e.clientY - y0) / k(), vel = (e.clientY - last) / k() / Math.max(1, performance.now() - lastT);
      const order = Object.keys(detents).sort((a, b) => topOf(a) - topOf(b));
      if (Math.abs(dy) < 6) { const i = order.indexOf(cur); return snap(cur === 'peek' ? 'mid' : order[Math.max(0, i - 1)] || cur); }
      if (cur === 'peek' && (dy < -40 || vel < -0.5)) return snap('full');
      if (Math.abs(vel) > 0.5) { const i = order.indexOf(cur); return snap(order[Math.max(0, Math.min(order.length - 1, i + (vel > 0 ? 1 : -1)))]); }
      const top = base + dy; snap(order.reduce((b, n) => Math.abs(topOf(n) - top) < Math.abs(topOf(b) - top) ? n : b, order[0])); };
    h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end);
  });
  snap(start, false);
  return { snap, get cur() { return cur; }, top: () => topOf(cur) };
}

    const d = DIST[k]; map.flyTo(d.x, d.y, 2.4, (ctlTop() + screen.offsetHeight * 0.54) / 2); }
  function close(keepView) { open = null; $('#panel').classList.remove('open'); $('#dchips').style.visibility = ''; screen.querySelector('.dock').classList.remove('away');
    if (!keepView) map.flyTo(520, 560, 0.62); }
  $('#dchips').addEventListener('click', e => { const b = e.target.closest('[data-d]'); b && focus(b.dataset.d); });
  $('#pback').addEventListener('click', () => close());
  chips();
  return { refresh() { screen.querySelector('.chips').innerHTML = chipsHTML(); chips(); list(); map.render(); refreshBadge(); } };
}

function refreshBadge() { screen.querySelectorAll('.roundbtn[aria-label="Bộ lọc"]').forEach(b => { b.querySelector('.badge')?.remove(); if (activeCount()) b.insertAdjacentHTML('beforeend', `<span class="badge">${activeCount()}</span>`); }); }

/* ---------- desk: option switcher, theme, fit ---------- */
const OPTS = [
  ['A', 'Hiện tại', 'Today’s map: drag the sheet through three heights; results follow the visible map area.', optA],
  ['B', 'Thẻ trượt', 'Full map with swipeable cards. Card and pin stay in sync. List is one tap away.', optB],
  ['C', 'Theo giờ', 'Pick a day and a start time first. Pins show times, and events outside the window fade.', optC],
  ['D', 'Danh sách trước', 'Opens on a list sorted by distance. A map button shows the same results as pins.', optD],
  ['E', 'Theo khu', 'Opens on neighbourhoods with counts. Pick one to see its pins and a short list.', optE],
];
let current, curIdx = 0;
function choose(i) {
  curIdx = i; try { localStorage.setItem('bbMapOpt', i); } catch (e) {}
  $('#opts').innerHTML = OPTS.map(([k, n], j) => `<button aria-pressed="${j === i}" data-i="${j}"><b>${k}</b>${n}</button>`).join('');
  $('#tag').textContent = OPTS[i][2];
  fit();
  current = OPTS[i][3]();
}
$('#opts').addEventListener('click', e => { const b = e.target.closest('[data-i]'); b && choose(+b.dataset.i); });
document.addEventListener('keydown', e => { if (e.target.closest && e.target.closest('input,[role="slider"]')) return; const n = +e.key; if (n >= 1 && n <= 5) choose(n - 1); });

const root = document.documentElement;
const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
const paintThemeBtn = () => { $('#themeBtn').innerHTML = isDark() ? ICON.sun : ICON.moon; };
$('#themeBtn').addEventListener('click', () => { root.dataset.theme = isDark() ? 'light' : 'dark'; paintThemeBtn(); });
paintThemeBtn();

function fit() {
  const bleed = innerWidth < 520, sc = $('#scaler'), st = $('#stage');
  phone.classList.toggle('bleed', bleed);
  if (bleed) { phone.style.width = st.offsetWidth + 32 + 'px'; phone.style.height = st.offsetHeight + 'px'; sc.style.transform = ''; sc.style.margin = '0 -16px'; }
  else { phone.style.width = ''; phone.style.height = ''; sc.style.margin = '12px 0 0';
    const k = Math.min(1, (st.offsetHeight - 30) / 876, (st.offsetWidth - 30) / 417); sc.style.transform = `scale(${k})`; }
}
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => choose(curIdx), 150); });
let saved = 0; try { saved = +(localStorage.getItem('bbMapOpt') || 0); } catch (e) {}
choose(saved >= 0 && saved < 5 ? saved : 0);
</script>
