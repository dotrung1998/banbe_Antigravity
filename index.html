<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/banbe-favicon.png" />
    <link rel="apple-touch-icon" href="/banbe-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ec" />
    <!-- Deliberately NO PWA/standalone markup: no web app manifest, no apple-mobile-web-app-capable, no
         mobile-web-app-capable, no apple-mobile-web-app-status-bar-style.
         iOS 26 chooses between two native layouts for a Home Screen site, and any of that markup selects the legacy
         one: a web view frame anchored at the very top of the screen whose height still leaves out the status bar,
         which parks a status-bar-tall (59-62pt) strip at the BOTTOM of the screen that is outside the page entirely
         — no CSS height, safe-area inset or JS can paint it (WebKit bugs 313800 and 316008; reproduced on iOS 26.6).
         With none of it, iOS uses the correct frame: the page starts below the opaque status bar and reaches the
         screen's bottom edge (home indicator included, hence the env(safe-area-inset-bottom) padding on the dock in
         App.jsx). iOS 26 opens a Home Screen site as a web app by itself, so nothing is lost there; the cost is that
         an iOS 16-25 install would open with Safari's chrome. The status-bar colour meta is gone for the same reason
         it was before: iOS 26.1+ ignores it and samples the fixed strip at the top of the page instead
         (body::before in src/index.css). -->
    <title>banbe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Be Vietnam Pro only (Modern Web Guidance pass, note 90). Jost stopped being a title face in note 83: fontPref.js
         writes --bb-font-display from the chosen face before the first render, so the family in theme.js's fallback is
         never reached. `subset` is not a CSS2-API parameter either (the API serves unicode-range subsets on its own),
         and one family instead of two is a smaller render-blocking stylesheet. -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="bb-logo-tint" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0 0 0 0 0.965  0 0 0 0 0.769  0 0 0 0 0.325  0 0 0 1 0" />
      </filter>
    </svg>
    <div id="root"></div>
    <!-- Task 1 (this session) — web has no OS-level rotation lock (the
         Screen Orientation API's lock() only works inside an installed/
         fullscreen PWA, not a normal mobile browser tab, which is what
         this app runs in); see src/index.css's own comment on the
         matching media query. Pure CSS/markup, no JS dependency, so it
         still works even if a script fails to load. -->
    <div id="bb-rotate-overlay">
      <p>Vui lòng xoay điện thoại về chiều dọc<br />Please rotate your phone back to portrait</p>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
