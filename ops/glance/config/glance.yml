server: { host: 0.0.0.0, port: 8080 }

auth:
  secret-key: ${GLANCE_SECRET}
  users:
    owner:
      password-hash: ${GLANCE_PASSWORD_HASH}

pages:
  - name: Hôm nay
    columns:
      - size: full
        widgets:
          - type: repository
            repository: dotrung1998/banbe_Antigravity
            token: ${GITHUB_TOKEN}
            pull-requests-limit: 5
            issues-limit: 5
            commits-limit: 5
          - type: custom-api
            title: banbe · Actions
            cache: 5m
            url: https://api.github.com/repos/dotrung1998/banbe_Antigravity/actions/runs
            parameters: { per_page: 8, exclude_pull_requests: true }
            headers: { Authorization: "Bearer ${GITHUB_TOKEN}", Accept: application/vnd.github+json, User-Agent: Glance-Dashboard }
            template: |
              <ul class="list list-gap-14 collapsible-container" data-collapse-after="3">
              {{ range .JSON.Array "workflow_runs" }}
                {{ $c := .String "conclusion" }}
                <li><a href="{{ .String "html_url" }}">{{ .String "display_title" }}</a>
                  <ul class="list-horizontal-text">
                    <li>{{ .String "name" }}</li>
                    <li {{ .String "updated_at" | parseTime "rfc3339" | toRelativeTime }}></li>
                    <li>{{ if eq $c "success" }}✅{{ else if eq $c "" }}⏳{{ else }}❌{{ end }}</li>
                  </ul>
                </li>
              {{ end }}
              </ul>

  - name: Study
    columns:
      - size: full
        widgets:
          - type: repository
            repository: dotrung1998/Trung_Do_Spezializierungsmodul
            token: ${GITHUB_TOKEN}
            pull-requests-limit: 5
            issues-limit: 5
            commits-limit: 5
          - type: custom-api
            title: JLU Spez · Actions
            cache: 5m
            url: https://api.github.com/repos/dotrung1998/Trung_Do_Spezializierungsmodul/actions/runs
            parameters: { per_page: 8, exclude_pull_requests: true }
            headers: { Authorization: "Bearer ${GITHUB_TOKEN}", Accept: application/vnd.github+json, User-Agent: Glance-Dashboard }
            template: |
              <ul class="list list-gap-14 collapsible-container" data-collapse-after="3">
              {{ range .JSON.Array "workflow_runs" }}
                {{ $c := .String "conclusion" }}
                <li><a href="{{ .String "html_url" }}">{{ .String "display_title" }}</a>
                  <ul class="list-horizontal-text">
                    <li>{{ .String "name" }}</li>
                    <li {{ .String "updated_at" | parseTime "rfc3339" | toRelativeTime }}></li>
                    <li>{{ if eq $c "success" }}✅{{ else if eq $c "" }}⏳{{ else }}❌{{ end }}</li>
                  </ul>
                </li>
              {{ end }}
              </ul>

          - type: repository
            repository: dotrung1998/JLU_Informationsvisualisierung
            token: ${GITHUB_TOKEN}
            pull-requests-limit: 5
            issues-limit: 5
            commits-limit: 5
          - type: custom-api
            title: JLU Vis · Actions
            cache: 5m
            url: https://api.github.com/repos/dotrung1998/JLU_Informationsvisualisierung/actions/runs
            parameters: { per_page: 8, exclude_pull_requests: true }
            headers: { Authorization: "Bearer ${GITHUB_TOKEN}", Accept: application/vnd.github+json, User-Agent: Glance-Dashboard }
            template: |
              <ul class="list list-gap-14 collapsible-container" data-collapse-after="3">
              {{ range .JSON.Array "workflow_runs" }}
                {{ $c := .String "conclusion" }}
                <li><a href="{{ .String "html_url" }}">{{ .String "display_title" }}</a>
                  <ul class="list-horizontal-text">
                    <li>{{ .String "name" }}</li>
                    <li {{ .String "updated_at" | parseTime "rfc3339" | toRelativeTime }}></li>
                    <li>{{ if eq $c "success" }}✅{{ else if eq $c "" }}⏳{{ else }}❌{{ end }}</li>
                  </ul>
                </li>
              {{ end }}
              </ul>

  - name: Notes
    columns:
      - size: full
        widgets:
          - type: bookmarks
            groups:
              - name: banbe
                links:
                  - { title: "Quartz · banbe", url: "${QUARTZ_BANBE}" }
                  - { title: "START-HERE", url: "${QUARTZ_BANBE}/START-HERE" }
                  - { title: "Code map", url: "${QUARTZ_BANBE}/graph/Code-map" }
                  - { title: "Obsidian · second-brain", url: "obsidian://open?vault=second-brain&file=START-HERE" }
              - name: JLU · Spezialisierungsmodul
                links:
                  - { title: "Quartz · JLU Spez", url: "${QUARTZ_SPEZ}" }
                  - { title: "Obsidian · Obsidian", url: "obsidian://open?vault=Obsidian" }
              - name: JLU · Informationsvisualisierung
                links:
                  - { title: "Quartz · JLU Vis", url: "${QUARTZ_VIS}" }
                  - { title: "Obsidian · Wissen", url: "obsidian://open?vault=Wissen_Informationsvisualisierung" }
